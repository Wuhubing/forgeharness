task_id: FH-002
goal: "Build ForgeHarness's Docker-sandboxed executor (2.4) and the full evaluation harness (section 3: sandbox/ + benchmark/) per SPEC.md at the repo root: docker_executor.py with resource limits + hard per-tool-call timeout, the 50 self-built benchmark tasks, baseline_harness.py (bare agent loop, no safeguards), harness.py (full ForgeHarness stack), run_eval.py (success rate / invalid-call-rate / interrupted-recovery rate), tests + README. Docker is NOT available in this environment, so the executor must expose a backend interface with an in-process fake backend used by tests and --smoke (no Docker needed) plus a real Docker backend implementing container execution; document exactly what is needed to reproduce the headline numbers (78.7% success, 3.9% invalid-call, 93.5% recovery)."
context: "SPEC.md at the repo root is authoritative; read it fully first. This depends on FH-001 core (state_machine, tool_registry, permission_engine, compactor, checkpoint) merged to main — your worktree base already has core/ and context/. Your worktree cwd is the repo root. Pick and justify per-call vs per-session container lifecycle. Design the executor as a backend interface so local tests/--smoke use a fake in-process backend while a real DockerBackend implements the production path (docker SDK or subprocess). Interrupted-run recovery: run_eval must support injecting an interruption (e.g. kill the process) at a random point in a subset of runs, then checkpoint/restore and check task completion to produce the recovery rate. The 50 tasks must be real self-authored tasks (multi-step goal + expected terminal condition)."
scope:
  allowed:
    - "sandbox/**"
    - "benchmark/**"
    - "tests/**"
    - "README.md"
    - "pyproject.toml"
  forbidden:
    - "core/**"
    - "context/**"
    - "SPEC.md"
    - ".agent/**"
    - ".gitignore"
    - ".worktrees/**"
constraints:
  - "Do not modify core/, context/, SPEC.md, .agent/**, or .gitignore."
  - "The docker executor must NOT be required to run the local test suite or --smoke: abstract a backend interface with an in-process fake for local runs."
  - "Per-tool-call timeout failures surface as a distinct error type, never conflated with tool-logic errors."
  - "Network default-deny, explicit allowlist per tool; resource limits (CPU/memory); per-session scratch volume wiped on end."
  - "Do NOT fabricate the headline numbers — run_eval computes them from real runs; adjust implementation details to stay consistent with the ground-truth numbers, never the reverse."
  - "State whether container lifecycle is per-call or per-session and justify it."
acceptance:
  - "run_eval.py produces success_rate, invalid_tool_call_rate, and recovery_rate computed from real runs (a --smoke flag runs a small subset locally with the fake backend)."
  - "docker_executor exposes a backend interface with an in-process fake backend (used by tests/--smoke) AND a real Docker backend with per-call timeout + resource limits + network default-deny."
  - "The interruption-injection path works: run_eval can kill a run mid-way, restore from checkpoint, assess completion, and compute the recovery rate."
  - "baseline_harness.py runs the tasks with a bare loop (no safeguards) and harness.py runs the same tasks with the full stack; both produce comparable metrics."
  - "Unit tests + --smoke pass locally (no Docker)."
verification:
  - "python3 -m pytest tests/ -q"
  - "python3 benchmark/run_eval.py --smoke"
  - "python3 -c \"from forgeharness.sandbox.docker_executor import DockerSandbox, FakeBackend; print('fh-sandbox-import-ok')\""
worker:
  type: deep
max_attempts: 2
risk: high
timeout_min: 120
