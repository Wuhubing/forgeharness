task_id: FH-001
goal: "Build ForgeHarness's non-Docker core per SPEC.md at the repo root, on the two foundations the spec mandates: (1) LangGraph state machine — a thin strict-transition wrapper around langgraph.StateGraph, and (2) MCP tool registry — a registry that wraps Model Context Protocol tool schemas and enforces validation-before-dispatch. Components: 2.1 state_machine (LangGraph StateGraph wrapper), 2.2 tool_registry (MCP-based), 2.3 permission_engine (fully custom), 2.5 compactor, 2.6 checkpoint/restore, per section 3 module layout (core/ + context/), packaged as a pip-installable Python project. langgraph, mcp, pydantic are already installed and verified working in this env."
context: "SPEC.md at the repo root is the authoritative design; read it fully first, especially each 'Interview angle' note — the code must reflect the reasoning there. The key interview distinction: what LangGraph/MCP give you for free vs. what you ADD (strict illegal-transition rejection, explicit event logging, validation-before-dispatch + rejection-count tracking) — that added constraint layer is your real contribution. This is a greenfield repo; base branch main holds only SPEC.md and .agent/config.yaml. Your isolated worktree's cwd is the repo root. langgraph, mcp, and pydantic import are all verified working here. Keep every module pure-Python and unit-testable with NO network, NO Docker, NO live LLM."
scope:
  allowed:
    - "core/**"
    - "context/**"
    - "tests/**"
    - "pyproject.toml"
    - "README.md"
  forbidden:
    - "sandbox/**"
    - "benchmark/**"
    - "SPEC.md"
    - ".agent/**"
    - ".gitignore"
    - ".worktrees/**"
constraints:
  - "Do not modify SPEC.md, .agent/**, or .gitignore."
  - "Build the state machine on langgraph.StateGraph (use its node/edge API), NOT a hand-rolled transition table; wrap it so illegal transitions raise a typed exception."
  - "Build the tool registry using MCP tool schemas (accept MCP Tool definitions, validate args against MCP inputSchema) — do NOT invent a custom JSON-schema format."
  - "On validation failure return a structured ToolCallError; never call the handler, never return a raw exception string."
  - "Track invalid_call_count / total_call_count on the registry (the 9.8% -> 3.9% metric)."
  - "Checkpoint payload includes current FSM state, compacted context, in-flight tool call (incl. whether it had already dispatched), and the permission/session policy in effect; written only after a successful transition completes."
  - "Name the top-level importable package forgeharness."
  - "Include a pytest unit test suite under tests/."
acceptance:
  - "state_machine exposes the spec's states/transitions as a langgraph StateGraph; an illegal transition raises a typed exception; every transition is logged with timestamp + triggering event."
  - "tool_registry.register(name, mcp_tool_schema, handler) and validate_and_dispatch(tool_call) validate args against the MCP inputSchema BEFORE dispatching; a malformed call returns a structured ToolCallError and the handler is never invoked."
  - "registry tracks invalid/total call counts (invalid_call_count / total_call_count) and exposes them as a metric."
  - "permission_engine.check(...) returns Allow / Deny / RequireConfirmation per RiskTier + session policy; a DESTRUCTIVE call without permission is Deny."
  - "compactor tracks a token budget, triggers at a configurable threshold, keeps the most recent K turns verbatim, preserves in-flight tool-call state, and logs the compaction event itself."
  - "checkpoint/restore: restore(checkpoint) returns a Session that immediately continues the FSM loop and never resumes mid-transition."
  - "The full unit test suite passes."
verification:
  - "python3 -m pytest tests/ -q"
  - "python3 -c \"from forgeharness.core.state_machine import ForgeStateGraph; from forgeharness.core.tool_registry import ToolRegistry; print('fh-core-import-ok')\""
worker:
  type: deep
max_attempts: 2
risk: high
timeout_min: 90
